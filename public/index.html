<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asteroids</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Fill the window while keeping 4:3, the original cabinet's aspect ratio. */
    canvas {
      display: block;
      width: min(100vw, 133.3333vh);
      height: min(75vw, 100vh);
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="js/main.js"></script>
</body>
</html>
