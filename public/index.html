<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Asteroids</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
      font: 16px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Fill the window while keeping 4:3, the original cabinet's aspect ratio. */
    canvas {
      display: block;
      width: min(100vw, 133.3333vh);
      height: min(75vw, 100vh);
      background: #000;
    }

    /* --- Overlays ------------------------------------------------------- */
    /* Opaque, so nothing shows through while the game is not being played. */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-content: center;
      justify-items: center;
      gap: 24px;
      padding: max(24px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
      background: #000;
      text-align: center;
    }
    .overlay.show { display: grid; }

    .title {
      margin: 0;
      font-size: clamp(28px, 7vw, 52px);
      letter-spacing: 0.34em;
      /* letter-spacing pads the right edge; pull it back so it looks centred */
      text-indent: 0.34em;
    }
    .subtitle { margin: 0; color: #9a9a9a; }

    .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }
    .choice {
      width: 210px;
      padding: 22px 18px;
      background: #000;
      color: #fff;
      border: 2px solid #4a4a4a;
      font: inherit;
      cursor: pointer;
    }
    .choice:hover, .choice:focus-visible { border-color: #fff; outline: none; }
    .choice .icon { font-size: 34px; line-height: 1.2; }
    .choice .what { margin-top: 10px; font-size: 18px; }
    .choice .how { margin-top: 8px; color: #9a9a9a; font-size: 13px; }
    /* The browser's guess, shown but never acted on without a tap. */
    .choice[data-suggested] { border-color: #fff; }
    .choice[data-suggested] .how::after {
      display: block;
      margin-top: 8px;
      color: #6c6;
      content: "looks like your device";
    }

    .note { margin: 0; max-width: 34em; color: #6a6a6a; font-size: 13px; }

    .actions { display: flex; gap: 14px; }
    .action {
      padding: 12px 22px;
      background: #000;
      color: #fff;
      border: 2px solid #4a4a4a;
      font: inherit;
      cursor: pointer;
    }
    .action:hover, .action:focus-visible { border-color: #fff; outline: none; }
    .action.primary { border-color: #fff; }

    /* --- Mode switch ----------------------------------------------------- */
    #switch-mode {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5;
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, 0.55);
      color: #7a7a7a;
      border: 1px solid #3a3a3a;
      font: 18px/1 ui-monospace, monospace;
      cursor: pointer;
      display: none;
    }
    #switch-mode:hover { color: #fff; border-color: #fff; }
    body.mode-desktop #switch-mode, body.mode-touch #switch-mode { display: block; }

    /* --- Rotate prompt (touch mode only) --------------------------------- */
    body.mode-touch.portrait #rotate { display: grid; }
    #rotate .icon { font-size: 46px; }

    /* --- Touch control strips -------------------------------------------- */
    /* The 4:3 playfield leaves a letterbox margin on a widescreen phone, and
       that is where the controls go, so they never cover the game. On a 16:9
       device the margin is only about 87px, so the strips have a floor and
       overlap the very edge of the field there rather than becoming unusable. */
    .pad {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 4;
      display: none;
      width: max(120px, calc((100vw - min(100vw, 133.3333vh)) / 2));
      background: rgba(255, 255, 255, 0.035);
      /* Without this, dragging scrolls the page instead of steering. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body.mode-touch:not(.portrait) .pad { display: block; }
    #pad-left  { left: 0;  border-right: 1px solid rgba(255, 255, 255, 0.13); }
    #pad-right { right: 0; border-left:  1px solid rgba(255, 255, 255, 0.13); }
    .pad .hint {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: 100%;
      color: #5a5a5a;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-align: center;
      pointer-events: none;
    }
    /* The stick is drawn in the DOM, not on the canvas: the strips can sit
       outside the canvas entirely, and the canvas draws in world units. */
    #stick-base, #stick-knob {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      border-radius: 50%;
      pointer-events: none;
    }
    #stick-base {
      width: 110px;
      height: 110px;
      margin: -55px 0 0 -55px;      /* centre on the touch point */
      border: 2px solid rgba(255, 255, 255, 0.22);
    }
    #stick-knob {
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.55);
    }

    /* Thumbs rest at the bottom, so in touch mode the switch button moves out
       of reach of the fire strip. */
    body.mode-touch #switch-mode {
      top: max(10px, env(safe-area-inset-top));
      bottom: auto;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Device chooser. Shown only when neither the URL nor storage has decided. -->
  <div id="chooser" class="overlay">
    <h1 class="title">ASTEROIDS</h1>
    <p class="subtitle">How are you playing?</p>
    <div class="choices">
      <button class="choice" id="choose-desktop">
        <div class="icon">⌨</div>
        <div class="what">PC / laptop</div>
        <div class="how">Arrow keys and space</div>
      </button>
      <button class="choice" id="choose-touch">
        <div class="icon">📱</div>
        <div class="what">Phone / tablet</div>
        <div class="how">Touch controls, held sideways</div>
      </button>
    </div>
    <p class="note">
      Your choice is remembered. You can change it later with the button in the
      bottom-right corner.
    </p>
  </div>

  <!-- Asked for when a phone is held upright in touch mode. -->
  <div id="rotate" class="overlay">
    <div class="icon">⟳</div>
    <p class="subtitle">Turn your device sideways to play.</p>
  </div>

  <!-- Touch controls: steer on the left, tap to fire on the right. -->
  <div id="pad-left" class="pad">
    <div id="stick-base"></div>
    <div id="stick-knob"></div>
    <div class="hint">MOVE</div>
  </div>
  <div id="pad-right" class="pad">
    <div class="hint">FIRE</div>
  </div>

  <button id="switch-mode" title="Switch control mode">⇄</button>

  <div id="switch-confirm" class="overlay">
    <p class="subtitle" id="switch-question">Switch control mode?</p>
    <p class="note">This reloads the page, so the game in progress will end.</p>
    <div class="actions">
      <button class="action" id="switch-cancel">Cancel</button>
      <button class="action primary" id="switch-ok">Switch</button>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
