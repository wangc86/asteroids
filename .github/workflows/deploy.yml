name: Deploy to GitHub Pages

# Build output is not committed, so Pages is built here rather than served from
# a branch. Tests gate the deploy: a red suite never reaches the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The ClojureScript compiler and its dependencies come from Maven, which
      # is by far the slowest part of a cold build.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: m2-

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npx shadow-cljs release app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
